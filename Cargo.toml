[package]
name = "banks"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
async-stream = "0.3.6"
async-trait = "0.1.91"
bytes = "1.12.1"
clap = { version = "4.6.5", features = ["derive"] }
dotenvy = "0.15.7"
eventsource-stream = "0.2.3"
futures-core = "0.3.33"
futures-util = "0.3.33"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "stream", "rustls"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
